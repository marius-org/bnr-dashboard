name: Build and Deploy BNR Dashboard

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'
      - 'README.md'
      - '*.md'

jobs:
  build-and-push:
    runs-on: control-node

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            mariuseu/bnr-dashboard:latest
            mariuseu/bnr-dashboard:${{ github.run_number }}

      - name: Update image tag in manifest
        run: |
          sed -i "s|mariuseu/bnr-dashboard:.*|mariuseu/bnr-dashboard:${{ github.run_number }}|g" \
            k8s/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "Update bnr-dashboard image to ${{ github.run_number }} [skip ci]"
          git push